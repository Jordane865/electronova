<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris — ElectroNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { corePlugins: { preflight: false } };</script>
</head>
<body>
  <div id="site-header"></div>

  <main class="wishlist-page">
    <div class="container">
      <div class="breadcrumb-bar">
        <nav class="breadcrumb">
          <a href="index.html">Accueil</a>
          <span class="breadcrumb-sep">›</span>
          <span class="breadcrumb-curr">Mes Favoris</span>
        </nav>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem">
        <h1 style="font-size:1.75rem;font-weight:800">Mes Favoris</h1>
        <button class="btn btn-primary btn-sm" onclick="addAllToCart()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          Tout ajouter au panier
        </button>
      </div>

      <div id="wishlist-empty" class="empty-state" style="display:none">
        <!-- <div class="empty-state-emoji">💝</div> -->
        <h2>Votre liste de favoris est vide</h2>
        <p>Sauvegardez vos produits préférés en cliquant sur le cœur.</p>
        <a href="shop.html" class="btn btn-primary">Découvrir nos produits</a>
      </div>

      <div id="wishlist-grid" class="wishlist-grid"></div>
    </div>
  </main>
<div class="gtranslate_wrapper"></div>
<script>window.gtranslateSettings = {"default_language":"fr","detect_browser_language":true,"languages":["fr","it","es","en","de","zh-CN"],"wrapper_selector":".gtranslate_wrapper","float_switcher_open_direction":"bottom"}</script>
<script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
  <div id="site-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
  <script src="js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlistPage();
    });

    function addAllToCart() {
      const items = Wishlist.getItems();
      if (items.length === 0) {
        Toast.show('info', 'Liste vide', 'Ajoutez d\'abord des produits à vos favoris.');
        return;
      }
      items.forEach(p => Cart.add(p.id, 1));
      Cart.open();
    }
  </script>
</body>
</html>
